<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>田园守卫战 (Wildwood Defenders) - 赛博街机平台</title>
  <link rel="stylesheet" href="/defense_static/css/defense.css?v=2.4.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
</head>
<body>
  <!-- Top Navigation Header -->
  <header class="game-header">
    <div class="brand-area">
      <span class="brand-logo">🐾</span>
      <h1 class="brand-title" data-i18n="defense.title">田园守卫战</h1>
    </div>

    <div class="header-controls">
      <!-- Language Selector -->
      <select id="lang-select-dropdown" class="lang-select" aria-label="Language Selector" data-i18n-title="nav.lang_tip" title="Language">
        <option value="en">EN</option>
        <option value="zh">简</option>
        <option value="zh-TW">繁</option>
        <option value="ja">日</option>
      </select>

      <!-- Return to Arcade Hub -->
      <a href="/" class="btn-icon" title="Return to Arcade Hub">
        <span>🏠</span>
        <span data-i18n="nav.hub">Hub</span>
      </a>

      <!-- Unified Pause in Top Navigator -->
      <button type="button" id="btn-header-pause" class="btn-nav-icon" data-i18n-title="defense.pause" title="Pause / Resume" aria-label="Pause">⏸</button>

      <!-- Sound Toggle -->
      <button type="button" id="btn-audio-toggle" class="btn-nav-icon" data-i18n-title="defense.audio" title="Toggle Sound" aria-label="Toggle Sound">🔊</button>

      <!-- Global Leaderboard Button -->
      <button type="button" id="btn-leaderboard" class="btn-nav-icon" data-i18n-title="lb.title" title="Leaderboard" aria-label="Leaderboard">🏆</button>

      <!-- Unified User Authentication Section -->
      <div id="user-auth-section" class="user-auth-section">
        <button type="button" id="btn-open-login" class="btn-icon btn-login">
          <span>👤</span>
          <span data-i18n="nav.login">Login</span>
        </button>
        <div id="user-badge" class="user-badge hidden">
          <div class="avatar" id="user-avatar">U</div>
          <div class="user-info">
            <span class="username" id="display-username">Player</span>
          </div>
          <button type="button" id="btn-logout" class="icon-btn-small" title="Logout">✕</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Game Workspace -->
  <main class="main-layout">
    <!-- Top HUD Stats Bar -->
    <div class="hud-bar">
      <div class="hud-stats">
        <div class="stat-item stat-gold">💰 <span data-i18n="defense.gold">金币</span>: <span id="val-gold">380</span></div>
        <div class="stat-item stat-lives">❤️ <span data-i18n="defense.lives">生命</span>: <span id="val-lives">20</span></div>
        <div class="stat-item stat-towers">🐾 <span data-i18n="defense.towers">守卫</span>: <span id="val-towers">0</span>/<span id="val-max-towers">8</span></div>
        <div class="stat-item stat-score">🏆 <span data-i18n="defense.score">积分</span>: <span id="val-score">0</span></div>
        <div class="stat-item stat-wave">🌊 <span data-i18n="defense.wave">波次</span>: <span id="val-wave">0</span> / <span id="val-max-wave">30</span></div>
      </div>

      <div class="hud-actions">
        <!-- Map Selection in Game HUD -->
        <select id="map-select-dropdown" class="map-select" aria-label="Select Map">
          <option value="0" data-i18n="defense.map_meadow">🌾 麦浪庄园</option>
          <option value="1" data-i18n="defense.map_woods">🌲 密林溪谷</option>
          <option value="2" data-i18n="defense.map_canyon">⛰️ 迷雾峡谷</option>
        </select>

        <div class="btn-speed-group">
          <button type="button" class="btn-speed active" data-speed="1">1x</button>
          <button type="button" class="btn-speed" data-speed="2">2x</button>
          <button type="button" class="btn-speed" data-speed="4">4x</button>
        </div>
        <button type="button" id="btn-auto-wave" class="btn-toggle-auto">⚡ <span data-i18n="defense.auto_wave">自动出波</span></button>
        <button type="button" id="btn-restart" class="btn-icon">🔄 <span data-i18n="defense.restart">重开</span></button>
        <button type="button" id="btn-start-wave" class="btn-primary-action">⚔️ <span data-i18n="defense.start_wave">开始进攻</span></button>
      </div>
    </div>

    <!-- Battle Canvas Arena & Commander Skills -->
    <div class="battle-workspace">
      <div class="canvas-container">
        <canvas id="defense-canvas" width="900" height="540"></canvas>
      </div>

      <!-- Commander Skills Sidebar -->
      <aside class="skills-sidebar">
        <button type="button" id="skill-carrot-rain" class="skill-btn" title="胡萝卜暴雨">
          <span class="skill-icon">🥕</span>
          <span class="skill-name" data-i18n="defense.skill_carrot_rain">胡萝卜暴雨</span>
          <span class="skill-cd"></span>
        </button>
        <button type="button" id="skill-gold-airdrop" class="skill-btn" title="金蛋空投">
          <span class="skill-icon">🥚</span>
          <span class="skill-name" data-i18n="defense.skill_gold_airdrop">金蛋空投</span>
          <span class="skill-cd"></span>
        </button>
        <button type="button" id="skill-animal-frenzy" class="skill-btn" title="动物狂暴">
          <span class="skill-icon">🔥</span>
          <span class="skill-name" data-i18n="defense.skill_frenzy">动物狂暴</span>
          <span class="skill-cd"></span>
        </button>
      </aside>
    </div>

    <!-- Bottom Deck: 8 Animal Defender Cards -->
    <section class="bottom-deck-panel">
      <div class="deck-header">
        <span class="deck-title">🐾 <span data-i18n="defense.deck_title">动物守卫编队 (点击选择并部署到草地上)</span></span>
        <span class="deck-tip" data-i18n="defense.cancel_tip">💡 右键/触摸空白处可取消部署</span>
      </div>

      <div id="tower-deck" class="tower-cards-grid">
        <!-- 9 Animal Defender Cards dynamically populated by defense_app.js -->
      </div>

      <!-- Tower Inspector (Appears when a placed tower is clicked) -->
      <div id="tower-inspector" class="tower-inspector-panel">
        <div class="inspector-info">
          <div id="inspector-title" class="inspector-title">🐓 雄鸡守卫 <span class="badge-lvl">v1</span></div>
          <div id="inspector-desc" class="inspector-desc">晨曦破晓：提升周围防御塔 25% 攻击速度</div>
        </div>

        <div class="inspector-stats">
          <div>💥 <span data-i18n="defense.damage">伤害</span>: <strong id="inspector-dmg" style="color:#00ff88">18</strong></div>
          <div>🎯 <span data-i18n="defense.range">射程</span>: <strong id="inspector-rng" style="color:#00f0ff">120</strong></div>
          <div>⚡ <span data-i18n="defense.speed">攻速</span>: <strong id="inspector-spd" style="color:#ffd700">3.0/s</strong></div>
        </div>

        <div class="inspector-actions">
          <button type="button" id="btn-tower-upgrade" class="btn-upgrade">⚡ <span data-i18n="defense.upgrade">升级强化</span> (<span id="upgrade-cost-val">80G</span>)</button>
          <button type="button" id="btn-tower-sell" class="btn-sell">💰 <span data-i18n="defense.sell">回收变现</span> (<span id="sell-refund-val">70G</span>)</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Game Over Modal -->
  <div id="game-over-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-icon">💀</div>
      <h2 class="modal-title" data-i18n="defense.game_over">防线失守！</h2>
      <div class="modal-stat"><span data-i18n="defense.final_wave">坚持波次</span>: <span id="go-wave">0</span></div>
      <div class="modal-stat"><span data-i18n="defense.final_score">最终得分</span>: <span id="go-score">0</span></div>
      <button type="button" id="btn-modal-restart" class="btn-primary-action" data-i18n="defense.play_again">再战一局</button>
    </div>
  </div>

  <!-- Victory Modal -->
  <div id="victory-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-icon">🎉</div>
      <h2 class="modal-title" style="color:#ffd700;" data-i18n="defense.victory">庄园守护大获全胜！</h2>
      <p style="color:var(--text-muted);font-size:13px;" data-i18n="defense.victory_text">成功击退全部 30 波入侵者！</p>
      <div class="modal-stat"><span data-i18n="defense.final_score">最终得分</span>: <span id="vic-score">0</span></div>
      <button type="button" id="btn-modal-vic-restart" class="btn-primary-action" data-i18n="defense.play_again">再战一局</button>
    </div>
  </div>

  <!-- Unified Auth Modal -->
  <div id="modal-auth" class="modal-overlay">
    <div class="modal-card" style="max-width: 380px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 id="auth-modal-title" style="color:var(--accent-green);font-size:18px;" data-i18n="auth.login_title">登录账号</h3>
        <button type="button" id="btn-close-auth" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;">✕</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button type="button" id="tab-login" class="btn-speed active" style="flex:1;" data-i18n="auth.tab_login">登录</button>
        <button type="button" id="tab-register" class="btn-speed" style="flex:1;" data-i18n="auth.tab_register">注册</button>
      </div>
      <form id="auth-form" style="display:flex;flex-direction:column;gap:10px;margin-top:10px;">
        <input type="text" id="auth-username" required placeholder="用户名 (3-20位)" data-i18n-placeholder="auth.username_ph" autocomplete="username" style="background:rgba(0,0,0,0.5);border:1px solid var(--border-glow);color:#fff;padding:8px 12px;border-radius:8px;outline:none;">
        <input type="password" id="auth-password" required placeholder="密码 (至少6位)" data-i18n-placeholder="auth.pwd_ph" autocomplete="current-password" style="background:rgba(0,0,0,0.5);border:1px solid var(--border-glow);color:#fff;padding:8px 12px;border-radius:8px;outline:none;">
        <div id="auth-error-msg" style="color:#ff0055;font-size:12px;display:none;"></div>
        <button type="submit" id="btn-auth-submit" class="btn-primary-action" style="margin-top:4px;" data-i18n="auth.btn_login">立即登录</button>
      </form>
    </div>
  </div>

  <!-- Unified Top 50 Leaderboard Modal -->
  <div id="modal-leaderboard" class="modal-overlay">
    <div class="modal-card" style="max-width: 580px; width: 95%;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="color:var(--accent-green);font-size:18px;" data-i18n="lb.modal_title">🏆 全球 Top 50 排行榜</h3>
        <button type="button" id="btn-close-leaderboard" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;">✕</button>
      </div>
      <div style="max-height: 400px; overflow-y: auto; margin-top: 10px; border: 1px solid var(--border-glow); border-radius: 8px;">
        <table style="width: 100%; border-collapse: collapse; font-size: 13px; text-align: left;">
          <thead>
            <tr style="background: rgba(0,0,0,0.6); border-bottom: 1px solid var(--border-glow);">
              <th style="padding: 8px 10px;" data-i18n="lb.col_rank">排名</th>
              <th style="padding: 8px 10px;" data-i18n="lb.col_player">玩家</th>
              <th style="padding: 8px 10px;" data-i18n="lb.col_score">积分</th>
              <th style="padding: 8px 10px;" data-i18n="defense.final_wave">坚持波次</th>
              <th style="padding: 8px 10px;" data-i18n="lb.col_time">时间</th>
            </tr>
          </thead>
          <tbody id="leaderboard-tbody">
            <tr><td colspan="5" style="text-align:center;padding:16px;" data-i18n="lb.loading">加载中...</td></tr>
          </tbody>
        </table>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px;">
        <button type="button" id="btn-refresh-leaderboard" class="btn-icon" data-i18n="lb.refresh">🔄 刷新</button>
        <button type="button" id="btn-close-leaderboard-footer" class="btn-primary-action" data-i18n="lb.close">关闭</button>
      </div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(14,26,20,0.95);border:1px solid var(--accent-green);color:#fff;padding:8px 18px;border-radius:30px;z-index:2000;font-weight:700;display:none;"></div>

  <!-- Scripts -->
  <script src="/defense_static/js/i18n.js?v=3.0.0"></script>
  <script src="/defense_static/js/defense_config.js?v=3.0.0"></script>
  <script src="/defense_static/js/defense_audio.js?v=3.0.0"></script>
  <script src="/defense_static/js/defense_api.js?v=3.0.0"></script>
  <script src="/defense_static/js/defense_engine.js?v=3.0.0"></script>
  <script src="/defense_static/js/defense_app.js?v=3.0.0"></script>
</body>
</html>
